<!--


  Koykan – živi pregled v5
  v5: opis na svim taskovima (editabilno), projekti (A_ marker, žuto, prekidač + batch),
      povlači samo otvorene (gumb "Gotovi" učita i dovršene), paginirano.
-->
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' https://fonts.googleapis.com; style-src-attr 'unsafe-inline'; font-src https://fonts.gstatic.com; img-src 'self' data:; connect-src 'self' https://koykan-tasks.koykan.workers.dev https://koykan-boards.koykan.workers.dev; object-src 'none'; base-uri 'self'; form-action 'self'">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>kDash</title>
<link rel="icon" href="icons/kdash.svg" type="image/svg+xml">
<link rel="icon" href="icons/kdash-192.png" sizes="192x192" type="image/png">
<link rel="apple-touch-icon" href="icons/kdash-180.png">
<link rel="manifest" href="icons/kdash.webmanifest">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Inter:wght@400;450;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">

<link rel="stylesheet" href="index-1.css">

<div class="wrap">
  <div class="top">
    <div><div class="title">Taskovi</div><div class="sub" id="sub">Spojeno na Cloudflare</div></div>
    <div class="prog" id="prog" style="display:none">
      <div class="ring"><svg width="56" height="56"><circle cx="28" cy="28" r="23" fill="none" stroke="var(--line)" stroke-width="5"></circle>
        <circle id="ring-fg" cx="28" cy="28" r="23" fill="none" stroke="var(--ok)" stroke-width="5" stroke-linecap="round" stroke-dasharray="144.5" stroke-dashoffset="144.5"></circle></svg><div class="pct" id="pct">0%</div></div>
      <div class="meta"><b id="open-n">0</b> otvoreno</div>
    </div>
  </div>

  <div id="banner" class="banner"></div>

  <div id="setup" class="setup" style="display:none">
    <h2>Unesi SECRET</h2>
    <p>String iz Apps Script koda. Sprema se samo lokalno, šalje se jedino na tvoj endpoint.</p>
    <input id="secret-in" type="password" placeholder="SECRET" autocomplete="off">
    <button class="btn" id="secret-save">Spremi i učitaj</button>
  </div>

  <div class="bar" id="bar" style="display:none">
    <div class="brow">
      <div class="qadd" id="qadd"><input type="text" id="q-title" placeholder="Novi task: upiši i pritisni Enter" autocomplete="off"><select id="q-owner" title="Čiji je task"></select><button class="btn add" id="q-save">Dodaj</button></div>
      <input type="text" id="search" class="searchbox" placeholder="Traži...">
      <button class="btn add" id="new-task" style="display:none">+ Novi task</button>
      <span class="synced" id="synced"></span>
      <button class="btn" id="refresh">Osvježi</button>
      <button class="btn" id="logout" title="Makni spremljeni secret">Secret</button>
    </div>
    <div class="brow vrow">
      <div class="views" id="views">
        <button data-v="today" class="on" title="Sve što je trebalo biti gotovo do danas, uključujući zakašnjelo">Za danas</button>
        <button data-v="week" title="Sve s rokom do nedjelje, uključujući zakašnjelo">Ovaj tjedan</button>
        <button data-v="wait" title="PENDING i ON HOLD: čeka nekog drugog">Čeka druge</button>
        <button data-v="done" title="Nositelj javio da je gotovo, čeka zatvaranje">Javljeno gotovo</button>
        <button data-v="req" class="dom-only" title="Sve što Domagoj traži od nositelja: rok, status, kašnjenje">Traži Domagoj</button>
        <button data-v="tim" class="dom-only" title="Po nositelju: otvoreno, kasni, pomicanja roka, bez upisa">Tim</button>
        <button data-v="all">Sve</button>
      </div>
      <div class="spacer"></div>
      <label class="sortbox">Sortiraj <select id="sort-by"><option value="">Zadano</option><option value="status">Status (ACTION, PENDING, ON HOLD, DONE)</option><option value="next">Next step do</option><option value="due">Rok</option><option value="title">Task (A-Ž)</option><option value="owner">Nositelj</option></select><button type="button" id="sort-dir" class="sortdir"></button></label>
      <button class="btn ghost" id="more-btn" title="Detaljni filteri, tablica, bulk">Više filtera</button>
    </div>
    <div class="brow fgrid" id="oldf" style="display:none">
      <div class="fbox">
        <span class="glabel g3">Vrijeme</span>
        <div class="seg" id="win-seg">
          <button data-w="all" class="on">Bilo kad</button>
          <button data-w="overdue">Overdue</button>
          <button data-w="today">Danas</button>
          <button data-w="tomorrow">Sutra</button>
          <button data-w="tilltoday">Do danas</button>
        </div>
      </div>
      <div class="fbox">
        <span class="glabel g1">Status</span>
        <div class="seg" id="wait-seg">
          <button data-a="all" class="on">Sve</button>
          <button data-a="action"><i class="dot d-act"></i>Action</button>
          <button data-a="pending"><i class="dot d-pend"></i>Pending</button>
          <button data-a="hold"><i class="dot d-hold"></i>On hold</button>
          <button data-a="done"><i class="dot d-done"></i>Done</button>
          <button data-a="notdone">Osim DONE</button>
        </div>
      </div>
      <div class="fbox" id="adv">
        <span class="glabel g4">Tip</span>
        <div class="seg" id="type-seg">
          <button data-t="all" class="on">Sve</button>
          <button data-t="project">Projekti</button>
          <button data-t="task">Taskovi</button>
          <button data-t="critical">Critical</button>
          <button data-t="fokus">Fokus</button>
          <button data-t="req" title="Zahtjevi koje traži Domagoj">Traži Domagoj</button>
        </div>
      </div>
      <div class="fbox" id="adv2">
        <span class="glabel g4">Akcije</span>
        <div class="fbtns">
          <button class="btn" id="load-completed">Gotovi: skriveni</button>
          <button class="btn proj" id="mark-proj" style="display:none">Označi projekte (A_)</button>
          <button class="btn" id="grid-edit" title="Uredi next step, next datum i rok za sve filtrirane odjednom">Tablica</button>
          <button class="btn" id="bulk-toggle">Bulk</button>
        </div>
      </div>
    </div>
  </div>

  <div class="addform" id="addform">
    <div class="fld grow"><label>Naziv</label><input type="text" id="a-title" placeholder="npr. Zovni dobavljača"></div>
    <div class="fld"><label>Osoba</label><select id="a-owner"></select></div>
    <div class="fld"><label>Rok</label><input type="date" id="a-due"></div>
    <div class="fld grow"><label>Next step</label><input type="text" id="a-ntext" placeholder="sljedeći korak"></div>
    <div class="fld"><label>Next datum</label><input type="date" id="a-ndate"></div>
    <button class="btn add" id="a-save">Dodaj</button>
    <button class="btn" id="a-cancel">Odustani</button>
  </div>

  <div class="filters" id="owner-filters" style="display:none"></div>
  <div id="loading" class="loading" style="display:none">Učitavam taskove...</div>
  <div class="grid" id="grid"></div>
<div class="mirror" id="mirror" style="display:none"></div>

  <div class="bulkbar" id="bulkbar">
    <span class="bcount"><b id="bsel-n">0</b> označeno</span>
    <div class="bsec"><span class="blabel">next opis</span><input type="text" id="b-ntext" placeholder="tekst next stepa"><button class="bset" id="b-ntext-set">Postavi</button></div>
    <div class="bsec"><span class="blabel">next datum</span><button data-bn="today">danas</button><button data-bn="d">+1d</button><button data-bn="w">+1tj</button><input type="date" id="b-ndate"><button class="bset" id="b-ndate-set">Postavi</button></div>
    <div class="bsec"><span class="blabel">rok</span><button data-br="w">+1tj</button><input type="date" id="b-due"><button class="bset" id="b-due-set">Postavi</button></div>
    <div class="bsec"><span class="blabel">critical</span><button id="b-crit-on">ozn.</button><button id="b-crit-off">skini</button></div>
    <div class="bsec"><button id="b-clear">Očisti</button></div>
  </div>

  <div class="ge-overlay" id="ge-overlay">
    <div class="ge">
      <div class="ge-head">
        <b>Tablica edit</b>
        <span class="ge-sub" id="ge-sub"></span>
        <div class="spacer"></div>
        <span class="ge-dirty" id="ge-dirty"></span>
        <button class="btn add" id="ge-save">Spremi izmjene</button>
        <button class="btn" id="ge-close">Zatvori</button>
      </div>
      <div class="ge-body" id="ge-body"></div>
    </div>
  </div>
</div>

<script src="index-1.js"></script>


<link rel="stylesheet" href="index-2.css">
<script src="index-2.js"></script>


<link rel="stylesheet" href="index-3.css">
<link rel="stylesheet" href="index-4.css">
<script src="shell.js"></script>
<script src="index-3.js"></script>


<script src="index-4.js"></script>
