<!doctype html>
<html lang="hr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Koykan · Keep exploring</title>
<style>
  :root{
    --bg:#0e1116; --panel:#161b22; --panel2:#1b2230; --line:#283041;
    --text:#e6edf3; --faint:#8b97a7; --dim:#5b6472; --accent:#7aa2f7;
    --good:#5ad19a; --warn:#e0af68; --bad:#ef6f6f;
    --mono:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
    --body:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--text);font-family:var(--body);font-size:14px;line-height:1.45;-webkit-text-size-adjust:100%}
  a{color:var(--accent)}
  .wrap{max-width:min(1880px,98vw);margin:0 auto;padding:16px 18px 80px}
  .top{display:flex;align-items:flex-end;gap:12px;flex-wrap:wrap;margin-bottom:6px}
  .brand{font:600 12px/1 var(--mono);letter-spacing:.14em;color:var(--accent);text-transform:uppercase}
  h1{font:600 22px/1.1 var(--body);margin:4px 0 0}
  .sub{font:500 11px/1 var(--mono);color:var(--faint);letter-spacing:.04em;margin-top:5px}
  .spacer{flex:1}
  .btn{font:600 12px/1 var(--body);background:var(--panel2);color:var(--text);border:1px solid var(--line);border-radius:8px;padding:9px 13px;cursor:pointer;white-space:nowrap}
  .btn:hover{border-color:#3a445a}
  .btn.primary{background:var(--accent);color:#0b1020;border-color:var(--accent)}
  .btn.ghost{background:transparent}
  .prog{margin:10px 0 16px}
  .prog .bar{height:8px;background:var(--panel2);border:1px solid var(--line);border-radius:99px;overflow:hidden}
  .prog .fill{height:100%;background:linear-gradient(90deg,var(--good),#7ee0b0);width:0;transition:width .35s ease}
  .prog .lbl{display:flex;justify-content:space-between;font:600 11px/1 var(--mono);color:var(--faint);margin-bottom:6px;letter-spacing:.04em}
  .prog .lbl b{color:var(--text)}
  .filters{display:flex;flex-direction:column;gap:8px;margin-bottom:14px}
  .chips{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
  .chips .klabel{font:600 10px/1 var(--mono);color:var(--dim);letter-spacing:.08em;text-transform:uppercase;margin-right:2px}
  .chip{font:600 11px/1 var(--body);background:var(--panel);border:1px solid var(--line);color:var(--faint);border-radius:99px;padding:6px 11px;cursor:pointer;user-select:none}
  .chip.on{background:var(--panel2);color:var(--text);border-color:#3a445a}
  .chip.on[data-acc=good]{color:var(--good);border-color:rgba(90,209,154,.5)}
  .chip.on[data-acc=warn]{color:var(--warn);border-color:rgba(224,175,104,.5)}
  .chip.on[data-acc=bad]{color:var(--bad);border-color:rgba(239,111,111,.5)}
  #search{flex:1;min-width:140px;background:var(--panel);border:1px solid var(--line);color:var(--text);border-radius:8px;padding:8px 11px;font-size:13px}
  .sec{background:var(--panel);border:1px solid var(--line);border-radius:12px;margin-bottom:12px;overflow-x:auto}
  .sec-h{display:flex;align-items:center;gap:10px;padding:11px 14px;border-bottom:1px solid var(--line);background:var(--panel2)}
  .sec-h .name{font:600 13px/1 var(--body)}
  .sec-h .count{font:600 10px/1 var(--mono);color:var(--faint);letter-spacing:.06em}
  .sec-h .done{color:var(--good)}
  .task{display:flex;align-items:center;gap:8px;padding:9px 14px;border-bottom:1px solid var(--line);flex-wrap:nowrap;min-width:1180px}
  .task:last-child{border-bottom:0}
  .task.is-done{opacity:.55}
  .task.is-crit{border-left:3px solid var(--bad)}
  .task.sub{background:rgba(255,255,255,.015);padding-left:30px}
  .task.dragover-top{box-shadow:inset 0 2px 0 var(--accent)}
  .task.dragover-bot{box-shadow:inset 0 -2px 0 var(--accent)}
  .grip{flex:none;width:14px;text-align:center;color:var(--dim);cursor:grab;font-size:13px;user-select:none}
  .grip:active{cursor:grabbing}
  .check{flex:none;width:20px;height:20px;border-radius:6px;border:1.5px solid var(--line);background:var(--bg);cursor:pointer;display:grid;place-items:center;color:transparent;font-size:13px}
  .task.is-done .check{background:var(--good);border-color:var(--good);color:#0b1020}
  .naziv{flex:2 1 240px;min-width:200px;cursor:text;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .task.is-done .naziv{text-decoration:line-through}
  .lnk{color:var(--accent);text-decoration:none;margin-left:6px;font-weight:600}
  .lnk:hover{text-decoration:underline}
  .t-status,.t-next{flex:1.5 1 160px;min-width:120px;background:var(--bg);border:1px solid var(--line);color:var(--text);border-radius:7px;padding:6px 8px;font-size:12px;font-family:var(--body)}
  .t-status::placeholder,.t-next::placeholder{color:var(--dim)}
  .ctl{display:flex;align-items:center;gap:6px;flex-wrap:nowrap;flex:none}
  select,input[type=date],input.inp{background:var(--bg);border:1px solid var(--line);color:var(--text);border-radius:7px;padding:6px 8px;font-size:12px;font-family:var(--body);color-scheme:dark}
  select.owner{width:108px}
  select.status{width:100px}
  select.status[data-v=Gotovo]{color:var(--good)}
  input[type=date]{font-family:var(--mono);font-size:11px;width:120px}
  .icon{flex:none;background:transparent;border:1px solid var(--line);border-radius:7px;color:var(--faint);cursor:pointer;padding:5px 7px;font-size:12px;line-height:1}
  .icon:hover{color:var(--text);border-color:#3a445a}
  .icon.crit.on{color:var(--bad);border-color:rgba(239,111,111,.5)}
  .icon.link.on{color:var(--accent);border-color:rgba(122,162,247,.5)}
  .icon.opis.has{color:var(--accent);border-color:rgba(122,162,247,.5);background:rgba(122,162,247,.12)}
  .subadd{padding:5px 14px 8px 44px;border-bottom:1px solid var(--line)}
  .subadd span{font:600 11px/1 var(--body);color:var(--dim);cursor:pointer}
  .subadd span:hover{color:var(--accent)}
  .board-head{display:flex;align-items:center;gap:8px;padding:6px 14px 8px;color:var(--dim);font:600 10px/1.2 var(--mono);letter-spacing:.05em;text-transform:uppercase;min-width:1180px}
  .board-head .hg{flex:none;width:14px}
  .board-head .hc{flex:none;width:20px}
  .board-head .hn{flex:2 1 240px;min-width:200px}
  .board-head .hs1,.board-head .hs2{flex:1.5 1 160px;min-width:120px}
  .board-head .hctl{display:flex;align-items:center;gap:6px;flex:none}
  .board-head .hctl span{display:inline-block;text-align:center}
  .head-scroll{overflow-x:auto}
  .addbar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;background:var(--panel);border:1px dashed var(--line);border-radius:12px;padding:12px 14px;margin-bottom:14px}
  .addbar.hidden{display:none}
  .addbar input.inp{flex:1;min-width:180px}
  .setup{max-width:440px;margin:60px auto;background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:24px}
  .setup h2{margin:0 0 6px;font-size:18px}
  .setup p{color:var(--faint);font-size:13px;margin:0 0 16px}
  .setup input{width:100%;background:var(--bg);border:1px solid var(--line);color:var(--text);border-radius:8px;padding:11px;font-size:14px;margin-bottom:12px}
  .hide{display:none!important}
  .banner{position:fixed;left:50%;bottom:18px;transform:translateX(-50%);background:var(--panel2);border:1px solid var(--line);color:var(--text);border-radius:10px;padding:10px 16px;font:600 12px/1 var(--body);box-shadow:0 8px 30px rgba(0,0,0,.4);opacity:0;pointer-events:none;transition:opacity .2s;z-index:50}
  .banner.show{opacity:1}
  .empty{padding:30px 14px;text-align:center;color:var(--faint);font-size:13px}
  .modal{position:fixed;inset:0;background:rgba(0,0,0,.55);display:none;align-items:center;justify-content:center;z-index:60}
  .modal.show{display:flex}
  .modal-box{width:min(520px,92%);background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:16px}
  .modal-box .mh{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px}
  .modal-box .mh .mt{font:500 15px/1.2 var(--body)}
  .modal-box .mh .ms{font:500 11px/1 var(--mono);color:var(--faint);margin-top:3px}
  .modal-box textarea{width:100%;min-height:150px;background:var(--bg);border:1px solid var(--line);color:var(--text);border-radius:8px;padding:10px;font:14px/1.5 var(--body);resize:vertical}
  .modal-box .mrow{display:flex;gap:8px;justify-content:flex-end;margin-top:12px}
  .opis-pop{position:fixed;z-index:70;max-width:360px;background:var(--panel2);border:1px solid #3a445a;color:var(--text);border-radius:10px;padding:10px 12px;font:400 13px/1.5 var(--body);box-shadow:0 8px 30px rgba(0,0,0,.5);display:none;white-space:pre-wrap}
  @media (max-width:640px){ h1{font-size:19px} .board-head{display:none} }

  .wpill{display:inline-block;font:700 9px/1.35 var(--body,inherit);letter-spacing:.03em;border-radius:999px;padding:1px 6px;margin-right:5px;vertical-align:middle;white-space:nowrap}
  .wp-act{color:#ffb15c;background:rgba(255,150,60,.14);border:1px solid rgba(255,150,60,.38)}
  .wp-pend{color:#7db4ff;background:rgba(90,150,255,.13);border:1px solid rgba(90,150,255,.34)}

  .wpill{cursor:pointer}
  .wp-none{color:var(--muted,#98a1ac);background:transparent;border:1px solid var(--line,#2c3340)}

  .t-due.over{border-color:rgba(239,111,111,.65) !important; color:#f3a0a0 !important}

  /* --- podtaskovi: jasna hijerarhija --- */
  .task:not(.sub) .naziv{font-weight:600}
  .task.sub{background:rgba(122,162,247,.055);padding-left:46px;border-left:3px solid rgba(122,162,247,.32)}
  .task.sub:hover{background:rgba(122,162,247,.10)}
  .task.sub.is-crit{border-left-color:var(--bad)}
  .task.sub .naziv{color:#c3cfdd;font-weight:500}
  .task.sub .naziv:before{content:'\21B3';color:var(--accent);opacity:.8;font-weight:700;margin-right:7px}
  .task.sub .check{width:17px;height:17px;border-radius:5px}
  .subadd{padding-left:50px}

  /* --- Brza operativa --- */
  .task.quick{background:rgba(90,209,154,.07);border-left:3px solid rgba(90,209,154,.55)}
  .task.quick .naziv{color:#8fe3ba}
  .task.quick .naziv:before{content:'+';color:var(--good);font-weight:700;margin-right:7px}
  .subadd span{color:var(--good)}

  .chip .ocnt{display:inline-block;min-width:16px;margin-left:4px;padding:0 4px;border-radius:99px;background:rgba(255,255,255,.08);color:var(--faint);font:700 10px/1.6 var(--mono);vertical-align:baseline}
  .chip.on .ocnt{background:rgba(122,162,247,.20);color:var(--accent)}
.t-dur{width:64px;flex:none;box-sizing:border-box;padding:4px 6px;font:600 12px/1.2 var(--mono,monospace);background:transparent;color:inherit;border:1px solid var(--line);border-radius:6px;text-align:right}
.t-dur.ghost{display:inline-block;border:0;height:1px;padding:0}
.planbar{display:flex;gap:10px 14px;align-items:center;flex-wrap:wrap;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:10px 14px;margin-bottom:14px}
.planbar label{font:600 10px/1 var(--mono);color:var(--faint);display:flex;gap:8px;align-items:center;text-transform:uppercase;letter-spacing:.06em}
#plan-info{font-size:12px;color:var(--faint);flex:1;min-width:220px}
#plan-info b{color:var(--text)} #plan-info .warn{color:var(--warn)} #plan-info .err{color:var(--bad)}
.btn.on{border-color:var(--accent);color:var(--accent)}
.btn:disabled{opacity:.5;cursor:default}
.t-dep{width:96px;flex:none;box-sizing:border-box;padding:4px 6px;font:600 12px/1.2 var(--mono,monospace);background:transparent;color:inherit;border:1px solid var(--line);border-radius:6px;text-transform:uppercase}
.t-dep.ghost{display:inline-block;border:0;height:1px;padding:0}
.task.flash{box-shadow:inset 0 0 0 2px var(--accent)}
.gantt{background:var(--panel);border:1px solid var(--line);border-radius:12px;overflow:auto;max-height:calc(100vh - 150px)}
.g-leg{display:flex;gap:14px;flex-wrap:wrap;padding:8px 12px;font:600 11px/1 var(--body);color:var(--faint);border-bottom:1px solid var(--line);position:sticky;left:0}
.g-leg .lg{display:inline-block;width:14px;height:10px;border-radius:3px;margin-right:5px;vertical-align:-1px}
.lg.fut{background:#4a5568}.lg.act{background:var(--accent)}.lg.done{background:var(--good)}.lg.late{background:var(--bad)}.lg.crit{background:transparent;box-shadow:0 0 0 2px var(--warn)}.lg.ms{width:9px;height:9px;transform:rotate(45deg);background:var(--warn)}
.g-in{position:relative}
.g-row{display:flex;border-bottom:1px solid rgba(40,48,65,.55)}
.g-lab{position:sticky;left:0;z-index:3;width:300px;flex:none;background:var(--panel);border-right:1px solid var(--line);padding:0 10px;display:flex;align-items:center;gap:8px;overflow:hidden;white-space:nowrap;cursor:pointer;font-size:12px}
.g-lab:hover{background:var(--panel2)}
.g-lab b{font-family:var(--mono);color:var(--accent);min-width:26px}
.g-lab .gn{overflow:hidden;text-overflow:ellipsis;flex:1}
.g-lab .go{color:var(--dim);font-size:11px}
.g-trk{position:relative;flex:none}
.g-sec{background:rgba(27,34,48,.75)}
.g-sec .g-lab{background:var(--panel2);cursor:default;font:600 10px/1 var(--mono);letter-spacing:.06em;text-transform:uppercase;color:var(--faint)}
.g-head{position:sticky;top:0;z-index:4;background:var(--panel2);border-bottom:1px solid var(--line)}
.g-head .g-lab{background:var(--panel2);z-index:5;cursor:default;font:600 10px/1 var(--mono);letter-spacing:.06em;text-transform:uppercase;color:var(--dim)}
.g-wk{position:absolute;top:0;height:100%;border-left:1px solid var(--line);font:600 10px/34px var(--mono);color:var(--faint);padding-left:5px;white-space:nowrap}
.g-we{position:absolute;top:0;bottom:0;background:rgba(255,255,255,.025);z-index:0}
.g-wl{position:absolute;top:0;bottom:0;width:1px;background:rgba(40,48,65,.9);z-index:0}
.g-today{position:absolute;top:0;bottom:0;width:2px;background:var(--bad);opacity:.75;z-index:2}
.g-bar{position:absolute;top:6px;height:18px;border-radius:5px;font:700 10px/18px var(--mono);color:#0b1020;padding:0 6px;white-space:nowrap;overflow:hidden;cursor:pointer;z-index:2;min-width:4px}
.g-bar.fut{background:#4a5568;color:var(--text)}.g-bar.act{background:var(--accent)}.g-bar.done{background:var(--good)}.g-bar.late{background:var(--bad)}
.g-bar.crit{box-shadow:0 0 0 2px var(--warn)}
.g-ms{position:absolute;top:8px;width:14px;height:14px;transform:rotate(45deg);background:var(--warn);z-index:2;cursor:pointer}
.g-ms.q{background:var(--dim)} .g-ms span{display:block;transform:rotate(-45deg);font:700 10px/14px var(--mono);text-align:center;color:var(--text)}
.g-svg{position:absolute;top:0;pointer-events:none;z-index:1}
.pl-wrap{max-height:55vh;overflow:auto;border:1px solid var(--line);border-radius:8px}
table.pl{width:100%;border-collapse:collapse;font-size:12px}
table.pl th{position:sticky;top:0;background:var(--panel2);text-align:left;font:600 10px/1 var(--mono);color:var(--faint);text-transform:uppercase;letter-spacing:.05em;padding:8px}
table.pl td{padding:6px 8px;border-top:1px solid var(--line);white-space:nowrap}
table.pl td.pn{white-space:normal;color:var(--faint)} table.pl s{color:var(--dim)} table.pl b{color:var(--text)} table.pl .same{color:var(--dim)}
</style>
</head>
<body>

<div id="setup" class="setup hide">
  <h2>Keep exploring</h2>
  <p>Unesi pristupni kod (dobio si ga od Doma). Pamti se na ovom uređaju.</p>
  <input id="setup-secret" type="password" placeholder="Pristupni kod" autocomplete="off">
  <button class="btn primary" id="setup-go" style="width:100%">Otvori board</button>
  <p id="setup-err" style="color:var(--bad);margin-top:10px"></p>
</div>

<div id="app" class="wrap hide">
  <div class="top">
    <div>
      <div class="brand">Koykan · SOP</div>
      <h1>Keep exploring</h1>
      <div class="sub" id="sub">učitavam…</div>
    </div>
    <div class="spacer"></div>
    <button class="btn" id="add-toggle">+ Novi task</button>
    <button class="btn ghost" id="refresh">Osvježi</button>
  </div>

  <div class="prog">
    <div class="lbl"><span>Napredak</span><span><b id="p-done">0</b> / <span id="p-total">0</span> gotovo</span></div>
    <div class="bar"><div class="fill" id="p-fill"></div></div>
  </div>

  <div class="planbar" id="planbar">
<label>Start projekta <input type="date" id="proj-start"></label>
<span id="plan-info"></span>
<button class="btn" id="v-toggle">Timeline</button>
<button class="btn primary" id="plan-apply">Primijeni datume</button>
</div>
<div class="addbar hidden" id="addbar">
    <select id="a-section"></select>
    <input class="inp" id="a-naziv" placeholder="Naziv koraka">
    <select id="a-owner"></select>
    <button class="btn primary" id="a-save">Dodaj</button>
    <button class="btn ghost" id="a-cancel">Odustani</button>
  </div>

  <div class="filters">
    <div class="chips" id="f-section"></div>
    <div class="chips" id="f-owner"></div>
    <div class="chips">
      <span class="klabel">Status</span>
      <span class="chip on" data-st="all">Sve</span>
      <span class="chip" data-st="Otvoreno">Otvoreno</span>
      <span class="chip" data-st="Gotovo" data-acc="good">Gotovo</span>
      <span class="klabel" style="margin-left:8px">Prikaz</span>
      <span class="chip" id="f-overdue" data-acc="warn">Overdue</span>
      <span class="chip" id="f-crit" data-acc="bad">Critical</span>
      <input id="search" placeholder="traži…">
    </div>
  </div>

  <div class="head-scroll">
    <div class="board-head" id="board-head">
      <span class="hg"></span>
      <span class="hc"></span>
      <span class="hn">Korak</span>
      <span class="hs1">Current status</span>
      <span class="hctl">
        <span style="width:64px" title="Trajanje grupe u danima">Dana</span>
        <span style="width:96px" title="Kreće nakon grupa">Nakon</span>
<span style="width:108px">Nositelj</span>
        <span style="width:100px">Status</span>
        <span style="width:30px">Opis</span>
        <span style="width:28px">Link</span>
        <span style="width:28px">Crit</span>
        <span style="width:28px">Briši</span>
        <span style="width:120px">Rok završetka</span>
      </span>
    </div>
  </div>
  <div id="board"></div>
<div id="gantt" class="gantt hide"></div>
</div>

<div class="modal" id="opis-modal">
  <div class="modal-box">
    <div class="mh">
      <div>
        <div class="mt">Opis koraka</div>
        <div class="ms" id="opis-for"></div>
      </div>
      <button class="icon" id="opis-x" aria-label="Zatvori">✕</button>
    </div>
    <textarea id="opis-text" placeholder="Unesi opis koraka…"></textarea>
    <div class="mrow">
      <button class="btn ghost" id="opis-cancel">Zatvori</button>
      <button class="btn primary" id="opis-save">Spremi</button>
    </div>
  </div>
</div>

<div class="opis-pop" id="opis-pop"></div>
<div class="banner" id="banner"></div>

<script>
  /* ====== CONFIG ====== */
  var ENDPOINT = 'https://koykan-boards.koykan.workers.dev/explore';
  var SECTIONS = [
    'A – Recepti i meni','B – Priprema za shooting','C – Food shooting','D – Obrada fotografija',
    'E – Podaci (Delivery/Kiosk)','F – Vizuali za storove','G – Upload vizuala','H – Platforme i kiosk',
    'I – Counter & Daily Deal','J – Go-live'
  ];
  var OWNERS   = ['Nino','Davor','AnaT','Ankica','Nataša','Silva','Tamara','Dom','Neodređeno'];
  var STATUSES = ['Otvoreno','Gotovo'];
  /* ==================== */

  var SECRET = localStorage.getItem('explore_secret') || '';
  var TASKS = [];
  var fSection='all', fStatus='all', fOwner={}, searchQ='', fOverdue=false, fCrit=false;
  OWNERS.forEach(function(o){ fOwner[o]=true; });

  function el(id){ return document.getElementById(id); }
  function byId(id){ return TASKS.filter(function(t){return t.id===id;})[0]; }
  function esc(s){ return String(s==null?'':s).replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];}); }
  function escAttr(s){ return esc(s).replace(/'/g,'&#39;'); }
  function dateVal(d){ if(!d) return ''; var s=String(d); if(/^\d{4}-\d{2}-\d{2}/.test(s)) return s.slice(0,10); var x=new Date(s); if(isNaN(x.getTime())) return ''; function p(n){return (n<10?'0':'')+n;} return x.getFullYear()+'-'+p(x.getMonth()+1)+'-'+p(x.getDate()); }

      var nn=String(t.note||'').replace(/^\s*pending\b/i,'ACTION');
      var op=('AUTO: '+dm+' PENDING -> ACTION, rok probijen\n'+String(t.opis||'')).replace(/\n+$/,'');
      t.note=nn; t.opis=op;
      api({action:'update', id:t.id, note:nn, opis:op}).catch(function(){});
    });
    setTimeout(function(){ banner(todo.length+' tema prebacena iz PENDING u ACTION (rok probijen)'); }, 400);
  }
  function renderAll(){ SCH=schedule(); buildSectionFilter(); buildOwnerFilter(); chipCounts(); renderProgress(); renderBoard(); renderPlanInfo(); if(VIEW==='gantt') renderGantt(); }

  function renderProgress(){
    var done=TASKS.filter(function(t){return t.status==='Gotovo';}).length, tot=TASKS.length;
    el('p-done').textContent=done; el('p-total').textContent=tot;
    el('p-fill').style.width = tot? Math.round(done/tot*100)+'%' : '0%';
    var crit=TASKS.filter(function(t){return t.critical && t.status!=='Gotovo';}).length;
    el('sub').textContent = tot+' koraka · '+done+' gotovo'+(crit?(' · '+crit+' critical'):'');
  }

  function renderBoard(){
    var board=el('board'); board.innerHTML='';
    var any=TASKS.filter(passFilter).length;
    if(!any){ board.innerHTML='<div class="empty">Nema koraka za prikaz. Provjeri filtere ili dodaj novi.</div>'; return; }
    var order=SECTIONS.slice();
    TASKS.forEach(function(t){ if(!t.parent && order.indexOf(t.section)<0) order.push(t.section); });
    order.forEach(function(sec){
      var secTasks=TASKS.filter(function(t){return t.section===sec;});
      var tops=sortSibs(secTasks.filter(function(t){return !t.parent;}));
      var visibleTops=tops.filter(function(top){
        if(passFilter(top)) return true;
        return secTasks.some(function(s){return s.parent===top.id && passFilter(s);});
      });
      if(!visibleTops.length) return;
      var card=document.createElement('div'); card.className='sec';
      var allInSec=secTasks.length, doneN=secTasks.filter(function(t){return t.status==='Gotovo';}).length;
      card.innerHTML='<div class="sec-h"><span class="name">'+esc(sec)+'</span><span class="count"><span class="done">'+doneN+'</span> / '+allInSec+'</span></div>';
      visibleTops.forEach(function(top){
        card.appendChild(taskRow(top,false));
        var subs=sortSibs(secTasks.filter(function(s){return s.parent===top.id;}));
        subs.forEach(function(s){ if(passFilter(s)) card.appendChild(taskRow(s,true)); });
        if(isQuick(top)) card.appendChild(subAddRow(top));
      });
      board.appendChild(card);
    });
  }

  function isQuick(t){ return /brza operativa/i.test(String(t.naziv||'')); }
  function subAddRow(top){
    var d=document.createElement('div'); d.className='subadd';
    var s=document.createElement('span'); s.textContent='+ podtask';
    s.addEventListener('click', function(){
      var v=prompt('Naziv podtaska:',''); if(v===null) return; v=v.trim(); if(!v) return;
      var tmp={id:'tmp'+Date.now(), section:top.section, naziv:v, owner:top.owner||'PM', status:'Otvoreno', sdue:'', due:'', note:'', opis:'', nextstep:'', link:'', critical:false, parent:top.id, ord:Date.now()};
      TASKS.push(tmp); renderAll();
      api({action:'add', section:top.section, naziv:v, owner:(top.owner||'PM'), status:'Otvoreno', parent:top.id, ord:Date.now()}).then(function(res){ if(res&&res.ok){banner('Podtask dodan'); load();} else load(); }).catch(load);
    });
    d.appendChild(s); return d;
  }

  function waitBadge(t){var n=(t.note||'').replace(/^[\s\-–—|:]+/,'');if(/^action\b/i.test(n))return '<span class="wpill wp-act" title="Klik: cikliraj status">🟠 ACTION</span> ';if(/^pending\b/i.test(n))return '<span class="wpill wp-pend" title="Klik: cikliraj status">🔵 PENDING</span> ';return '<span class="wpill wp-none" title="Klik: postavi status">status</span> ';}
  function dueCls(d,st){ if(!d||st==='Gotovo') return ''; var x=new Date(d); if(isNaN(x.getTime())) return ''; x.setHours(0,0,0,0); var t0=new Date(); t0.setHours(0,0,0,0); return x<t0?' over':''; }
  function durCtl(t,isSub){ if(isSub||!isGroup(t)) return '<span class="t-dur ghost"></span><span class="t-dep ghost"></span>'; return '<input class="t-dur" type="number" min="0" step="1" inputmode="numeric" placeholder="dana" title="'+durTitle(t)+'" value="'+escAttr(t.dur||'')+'">'+depCtl(t); }
  function taskRow(t, isSub){
    var done=t.status==='Gotovo';
    var row=document.createElement('div'); row.className='task'+(done?' is-done':'')+(t.critical?' is-crit':'')+(isSub?' sub':'')+((!isSub&&isQuick(t))?' quick':'');
    row.setAttribute('data-id', t.id);
    row.innerHTML =
      '<span class="grip" draggable="true" title="Povuci za promjenu redoslijeda">⠿</span>'+
      '<div class="check" title="Označi gotovo">'+(done?'✓':'')+'</div>'+
      '<div class="naziv" title="'+escAttr(t.naziv)+'">'+waitBadge(t)+esc(t.naziv)+(t.link?(' <a class="lnk" href="'+escAttr(t.link)+'" target="_blank" rel="noopener" title="Otvori link">↗</a>'):'')+'</div>'+
      '<input class="t-status" placeholder="current status…" value="'+escAttr(t.note||'')+'" title="Current status">'+
      '<div class="ctl">'+durCtl(t,isSub)+
        ownerSelect(t)+
        statusSelect(t)+
        '<button class="icon opis'+(t.opis?' has':'')+'" title="Opis (klik za uredi, hover za pregled)">✎</button>'+
        '<button class="icon link'+(t.link?' on':'')+'" title="Link (Google Drive doc)">🔗</button>'+
        '<button class="icon crit'+(t.critical?' on':'')+'" title="Critical">⚑</button>'+
        '<button class="icon del" title="Obriši">✕</button>'+
        '<input type="date" class="t-due'+dueCls(t.due,t.status)+'" value="'+escAttr(dateVal(t.due))+'" title="Rok završetka">'+
      '</div>';
    row.querySelector('.check').addEventListener('click', function(){ update(t, {status: done?'Otvoreno':'Gotovo'}); });
    row.querySelector('.naziv').addEventListener('click', function(){ editNaziv(t, row); }); var _du=row.querySelector('input.t-dur'); if(_du){ ['click','mousedown'].forEach(function(ev){ _du.addEventListener(ev,function(e){ e.stopPropagation(); }); }); _du.addEventListener('change', function(){ var v=String(this.value||'').replace(/[^0-9]/g,''); if(v!==String(t.dur||'')) update(t,{dur:v}); }); } wireDep(row,t);
    row.querySelector('.t-status').addEventListener('change', function(){ if(this.value.trim()!==String(t.note||'')) update(t, {note:this.value.trim()}); });
    row.querySelector('.wpill')?.addEventListener('click', function(e){ e.stopPropagation(); var base=(t.note||'').replace(/^\s*(action|pending)\b\s*[-–—|:]*\s*/i,''); var raw=(t.note||'').replace(/^[\s\-–—|:]+/,''); var w=/^action\b/i.test(raw)?'action':(/^pending\b/i.test(raw)?'pending':''); var nw=({'':'action','action':'pending','pending':''})[w]; var kw=nw==='action'?'ACTION':(nw==='pending'?'PENDING':''); var nn=kw?(base?(kw+' - '+base):kw):base; update(t,{note:nn}); });
    row.querySelector('.t-next')?.addEventListener('change', function(){ if(this.value.trim()!==String(t.nextstep||'')) update(t, {nextstep:this.value.trim()}); });
    row.querySelector('.owner').addEventListener('change', function(){ update(t, {owner:this.value}); });
    row.querySelector('.status').addEventListener('change', function(){ update(t, {status:this.value}); });
    row.querySelector('.t-due').addEventListener('change', function(){ update(t, {due:this.value}); });
    row.querySelector('.crit').addEventListener('click', function(){ update(t, {critical: t.critical?'false':'true'}); });
    var ob=row.querySelector('.icon.opis');
    ob.addEventListener('click', function(){ openOpis(t); });
    ob.addEventListener('mouseenter', function(){ if(t.opis) showOpisPop(ob, t.opis); });
    ob.addEventListener('mouseleave', function(){ el('opis-pop').style.display='none'; });
    row.querySelector('.icon.link').addEventListener('click', function(){ var v=prompt('Zalijepi link (Google Drive doc). Ostavi prazno za brisanje:', t.link||''); if(v!==null){ update(t, {link:v.trim()}); } });
    var lnkA=row.querySelector('.naziv .lnk'); if(lnkA) lnkA.addEventListener('click', function(e){ e.stopPropagation(); });
    row.querySelector('.del').addEventListener('click', function(){ if(confirm('Obrisati korak "'+t.naziv+'"?')) del(t); });
    wireDrag(row, t);
    return row;
  }

  /* ---------- Opis modal + hover ---------- */
  var opisCur=null;
  function openOpis(t){ opisCur=t; el('opis-for').textContent=t.naziv; el('opis-text').value=t.opis||''; el('opis-modal').classList.add('show'); el('opis-pop').style.display='none'; setTimeout(function(){el('opis-text').focus();},30); }
  function closeOpis(){ el('opis-modal').classList.remove('show'); opisCur=null; }
  el('opis-save').addEventListener('click', function(){ if(opisCur){ update(opisCur, {opis: el('opis-text').value.trim()}); } closeOpis(); });
  el('opis-cancel').addEventListener('click', closeOpis);
  el('opis-x').addEventListener('click', closeOpis);
  el('opis-modal').addEventListener('click', function(e){ if(e.target===this) closeOpis(); });
  function showOpisPop(btn, text){
    var pop=el('opis-pop'); pop.textContent=text; pop.style.display='block';
    var b=btn.getBoundingClientRect();
    var w=pop.offsetWidth, left=b.left - w + b.width; if(left<8) left=8;
    var top=b.bottom+6; if(top+pop.offsetHeight>window.innerHeight-8) top=b.top-pop.offsetHeight-6;
    pop.style.left=left+'px'; pop.style.top=top+'px';
  }

  function wireDrag(row, t){
    var grip=row.querySelector('.grip');
    grip.addEventListener('dragstart', function(e){ window._drag={id:t.id, parent:t.parent||'', section:t.section}; try{e.dataTransfer.setData('text/plain', t.id);}catch(_){} e.dataTransfer.effectAllowed='move'; });
    row.addEventListener('dragover', function(e){
      var d=window._drag; if(!d) return;
      if(d.section!==t.section || (d.parent||'')!==(t.parent||'') || d.id===t.id) return;
      e.preventDefault();
      var r=row.getBoundingClientRect(); var before=(e.clientY < r.top+r.height/2);
      row.classList.toggle('dragover-top', before); row.classList.toggle('dragover-bot', !before);
    });
    row.addEventListener('dragleave', function(){ row.classList.remove('dragover-top','dragover-bot'); });
    row.addEventListener('drop', function(e){
      var d=window._drag; row.classList.remove('dragover-top','dragover-bot'); if(!d) return;
      if(d.section!==t.section || (d.parent||'')!==(t.parent||'') || d.id===t.id) return;
      e.preventDefault();
      var r=row.getBoundingClientRect(); var before=(e.clientY < r.top+r.height/2);
      reorder(d.id, t.id, before);
      window._drag=null;
    });
  }

  function reorder(draggedId, targetId, before){
    var d=byId(draggedId), tgt=byId(targetId); if(!d||!tgt) return;
    if(d.section!==tgt.section || (d.parent||'')!==(tgt.parent||'')) return;
    var sibs=sortSibs(TASKS.filter(function(x){ return x.section===d.section && (x.parent||'')===(d.parent||''); }));
    sibs=sibs.filter(function(x){return x.id!==d.id;});
    var idx=sibs.indexOf(tgt); if(idx<0) return;
    sibs.splice(before?idx:idx+1, 0, d);
    var changed=[];
    sibs.forEach(function(x,i){ var no=(i+1)*10; if(x.ord!==no){ x.ord=no; changed.push(x); } });
    renderAll();
    changed.forEach(function(x){ api({action:'update', id:x.id, ord:x.ord}).catch(function(){}); });
    banner('Redoslijed spremljen');
  }

  function ownerSelect(t){
    var cur = OWNERS.indexOf(t.owner)>=0 ? t.owner : (t.owner||'Neodređeno');
    var opts = OWNERS.slice(); if(opts.indexOf(cur)<0) opts.unshift(cur);
    return '<select class="owner">'+opts.map(function(o){return '<option'+(o===cur?' selected':'')+'>'+esc(o)+'</option>';}).join('')+'</select>';
  }
  function statusSelect(t){
    return '<select class="status" data-v="'+escAttr(t.status)+'">'+STATUSES.map(function(s){return '<option'+(s===t.status?' selected':'')+'>'+esc(s)+'</option>';}).join('')+'</select>';
  }

  function editNaziv(t, row){
    var cell=row.querySelector('.naziv');
    var inp=document.createElement('input'); inp.className='inp'; inp.value=t.naziv; inp.style.flex='2'; inp.style.minWidth='200px';
    cell.replaceWith(inp); inp.focus(); inp.select();
    function commit(){ var v=inp.value.trim(); if(v && v!==t.naziv){ update(t,{naziv:v}); } else { renderBoard(); } }
    inp.addEventListener('blur', commit);
    inp.addEventListener('keydown', function(e){ if(e.key==='Enter'){ inp.blur(); } if(e.key==='Escape'){ renderBoard(); } });
  }

  function applyLocal(t, fields){
    Object.keys(fields).forEach(function(k){
      if(k==='critical') t.critical=(fields[k]==='true');
      else t[k]=fields[k];
    });
  }
  function update(t, fields){
    applyLocal(t, fields); renderAll();
    var p={action:'update', id:t.id}; Object.keys(fields).forEach(function(k){ p[k]=fields[k]; });
    api(p).then(function(res){ if(!res||res.error){ banner('Nije spremljeno: '+((res&&res.error)||'?')); load(); } }).catch(function(e){ banner('Greška: '+e); load(); });
  }
  function del(t){
    TASKS=TASKS.filter(function(x){return x.id!==t.id && x.parent!==t.id;}); renderAll();
    api({action:'delete', id:t.id}).then(function(res){ if(!res||res.error){ banner('Brisanje nije uspjelo'); load(); } else banner('Obrisano'); }).catch(function(){ load(); });
  }

  el('add-toggle').addEventListener('click', function(){ el('addbar').classList.toggle('hidden'); if(!el('addbar').classList.contains('hidden')) el('a-naziv').focus(); });
  el('a-cancel').addEventListener('click', function(){ el('addbar').classList.add('hidden'); el('a-naziv').value=''; });
  el('a-save').addEventListener('click', function(){
    var naziv=el('a-naziv').value.trim(); if(!naziv){ el('a-naziv').focus(); return; }
    var section=el('a-section').value, owner=el('a-owner').value, ord=Date.now();
    var tmp={id:'tmp'+Date.now(), section:section, naziv:naziv, owner:owner, status:'Otvoreno', sdue:'', due:'', note:'', opis:'', nextstep:'', link:'', critical:false, parent:'', ord:ord};
    TASKS.push(tmp); renderAll(); el('a-naziv').value='';
    api({action:'add', section:section, naziv:naziv, owner:owner, status:'Otvoreno', ord:ord}).then(function(res){
      if(res&&res.ok){ banner('Dodano'); load(); } else { banner('Dodavanje nije uspjelo'); load(); }
    }).catch(function(){ load(); });
  });

  function fillAddSelects(){
    el('a-section').innerHTML = SECTIONS.map(function(s){return '<option>'+esc(s)+'</option>';}).join('');
    el('a-owner').innerHTML = OWNERS.map(function(o){return '<option'+(o==='Dom'?' selected':'')+'>'+esc(o)+'</option>';}).join('');
  }

  fillAddSelects();
  if(ENDPOINT.indexOf('PASTE_')===0){
    el('setup').classList.remove('hide');
    el('setup-err').textContent='Postavi ENDPOINT u kodu (Apps Script /exec URL) pa osvježi.';
  } else if(!SECRET){
    showSetup();
  } else {
    el('app').classList.remove('hide'); load();
  }
</script>
<script>
/* ---- provjera verzije: javi kad je deployana novija stranica ---- */
(function(){
  var tag0 = null, last = 0;
  function bar(){
    if(document.getElementById('vupd')) return;
    var d = document.createElement('div');
    d.id = 'vupd';
    d.style.cssText = 'position:fixed;left:0;right:0;bottom:0;z-index:99999;background:#1f6fb2;color:#fff;font:600 13px/1.4 Segoe UI,Arial,sans-serif;padding:10px 14px;display:flex;gap:12px;align-items:center;justify-content:center;box-shadow:0 -2px 12px rgba(0,0,0,.35)';
    var s = document.createElement('span');
    s.textContent = 'Dashboard je a\u017euriran. Osvje\u017ei stranicu da dobije\u0161 zadnju verziju.';
    d.appendChild(s);
    var b = document.createElement('button');
    b.textContent = 'Osvje\u017ei sada';
    b.style.cssText = 'background:#fff;color:#1f6fb2;border:0;border-radius:6px;padding:6px 12px;font:700 13px Segoe UI,Arial,sans-serif;cursor:pointer';
    b.addEventListener('click', function(){ location.reload(); });
    d.appendChild(b);
    document.body.appendChild(d);
  }
  function check(){
    var now = Date.now(); if(now - last < 60000) return; last = now;
    fetch(location.pathname + '?vc=' + now, {method:'HEAD', cache:'no-store'}).then(function(r){
      var t = r.headers.get('etag') || r.headers.get('last-modified') || '';
      if(!t) return;
      if(tag0 === null){ tag0 = t; return; }
      if(t !== tag0) bar();
    }).catch(function(){});
  }
  check();
  setInterval(check, 600000);
  document.addEventListener('visibilitychange', function(){ if(!document.hidden) check(); });
})();
</script>
